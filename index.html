<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Card</title>
<style>
  body {
    background: #faf7f0;
    font-family: 'Trebuchet MS', sans-serif;
  }
  .card {
    max-width: 550px;
    margin: 80px auto;
    padding: 40px;
    background: white;
    border-left: 10px solid #d4a437;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }
  h1 {
    color: #d4a437;
    font-size: 2.2em;
  }
  p {
    font-size: 1.15em;
    color: #444;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Happy Birthday Mum</h1>
    <p>
      May your year ahead be filled with peace, laughter, and beautiful moments.
      You deserve every bit of joy today.
    </p>
  </div>
</body>
</html>
